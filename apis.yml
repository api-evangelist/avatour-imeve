description: AVATOUR (Imeve Inc.) is a 360-degree video collaboration platform that
  lets distributed teams conduct remote site visits, inspections, virtual tours, and
  location-based training without travel. It supports live real-time 360 streaming,
  synchronous shared sessions, and asynchronous on-demand recordings with annotations
  and reporting, serving manufacturing, construction, real estate, logistics, and
  retail. It was surfaced as a 500 Global portfolio company and added to the API Evangelist
  network; no public API, SDK, or developer documentation surface was found during
  the enrichment pass.
